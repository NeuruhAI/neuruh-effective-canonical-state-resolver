[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuruh-effective-canonical-state-resolver"
version = "0.1.0a0"
description = "Deterministic read-only projection of effective canonical truth from lifecycle state plus canonical revision lineage. A resolver, not an authority."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jeramie Hicks / Neuruh"}]

[project.scripts]
neuruh-effective-canonical-state-resolver="neuruh_effective_canonical_state_resolver.cli:main"

[project.urls]
Homepage = "https://github.com/NeuruhAI/neuruh-effective-canonical-state-resolver"
Repository = "https://github.com/NeuruhAI/neuruh-effective-canonical-state-resolver"

[tool.setuptools.packages.find]
where = ["src"]
